<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="SPACES活動記録の一覧ページ。作業の記録を時系列でまとめて閲覧できます。">
	<title>活動記録一覧 | SPACES</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=BIZ+UDP+Gothic:wght@400;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../style.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="log-header">
		<a class="log-brand" href="../What-is-Spaces.html" aria-label="SPACESトップページへ戻る">
			<img src="../signage-images/SPACES.png" alt="SPACES">
			<span>SPACES</span>
		</a>
		<a class="log-back" href="../What-is-Spaces.html">プロジェクト概要へ戻る ↗</a>
	</header>

	<main class="log-main">
		<div class="log-meta"><span>活動記録</span><time>一覧</time></div>
		<h1 class="log-title">活動記録一覧</h1>
		<p class="log-lead">SPACESでの試作・検証・工作の記録を、時系列でまとめて見ることができます。新しい記録が増えるたびにこの一覧にも追加されます。</p>
		<div class="log-rule"></div>
		<div id="log-list" class="log-card-grid" aria-live="polite"></div>
	</main>

	<footer class="log-footer">
		<p>SPACES / 活動記録</p>
		<p>夢プロジェクト / 駐車場混雑状況可視化</p>
	</footer>

	<script>
		const fallbackEntries = [
			{
				title: '筐体づくり、始めました。',
				file: '20260908_筐体作成.html',
				date: '2026.09.08',
				summary: 'デジタル看板の筐体づくりを開始した記録です。'
			}
		];

		const renderCards = (entries) => {
			const list = document.getElementById('log-list');
			if (!list) return;
			list.innerHTML = '';

			const safeEntries = Array.isArray(entries) ? entries : fallbackEntries;
			safeEntries.forEach((entry, index) => {
				const article = document.createElement('article');
				article.className = 'log-card';
				const label = document.createElement('div');
				label.className = 'log-card-meta';
				label.innerHTML = `<span>活動記録 / ${String(index + 1).padStart(2, '0')}</span><time>${entry.date || '不明'}</time>`;

				const heading = document.createElement('h2');
				heading.textContent = entry.title || '無題の記録';

				const summary = document.createElement('p');
				summary.className = 'log-card-summary';
				summary.textContent = entry.summary || '詳細を確認してください。';

				const link = document.createElement('a');
				link.className = 'log-card-button';
				link.href = entry.file || '#';
				link.textContent = '記事を見る ↗';

				article.append(label, heading, summary, link);
				list.appendChild(article);
			});
		};

		fetch('log-index.json')
			.then((response) => {
				if (!response.ok) throw new Error('log-index.json not found');
				return response.json();
			})
			.then((entries) => renderCards(entries))
			.catch(() => renderCards(fallbackEntries));
	</script>
</body>
</html>

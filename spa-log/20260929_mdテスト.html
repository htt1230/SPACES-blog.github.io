<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="SPACESブログ。mdで書けるようにしてみた">
	<title>サイトをmdで書けるようにしてみた</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=BIZ+UDP+Gothic:wght@400;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <!-- marked.js CDNの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
	<header class="log-header">
		<a class="log-brand" href="../What-is-Spaces.html" aria-label="SPACESトップページへ戻る">
			<img src="../signage-images/SPACES.png" alt="SPACES">
			<span>SPACES</span>
		</a>
		<a class="log-back" href="/spa-log/">ブログ一覧</a>
	</header>

	<main class="log-main">
		<div class="log-meta"><span>ブログ</span><time datetime="2026-09-29">2026.09.29</time></div>
		<h1 class="log-title">html→mdを試してみた</h1>
		<h2>筆者:E</h2>
		<p class="log-lead">完全に番外編です。mdファイルをhtmlに変換してブログを書く効率をあげようということ。</p>

		<div class="log-rule"></div>

		<!-- セクション1: 移動 -->
		<section class="log-section">
			<div class="log-label">見出し1</div>
			<div class="log-content" data-markdown>
## 見出し2
本文<span class="emphasize">ここにhtmlのspanの挿入も可能</span>
![移動の様子](images/20260916/IMG_3570.jpg)
↑テスト画像
			</div>
		</section>




	</main>

	<footer class="log-footer">
		<p>SPACES / ブログ</p>
		<p>夢プロジェクト / 駐車場混雑状況可視化</p>
	</footer>

	<!-- Markdownを自動でHTMLに変換して流し込むスクリプト -->
	<script>
		document.querySelectorAll('[data-markdown]').forEach(el => {
			// インデントのズレを防ぐためトリムしてからパースする
			const rawMarkdown = el.innerHTML.trim();
			el.innerHTML = marked.parse(rawMarkdown);
		});
	</script>
</body>
</html>
